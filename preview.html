function persist(){try{localStorage.setItem('youan-demo-v2',JSON.stringify(db));return true}catch{toast('瀏覽器無法保存；本次修改僅保留至頁面關閉。');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),3600)}
function level(s){return s.complete<60?'資料不足':s.score>=db.thresholds[2]?'高風險':s.score>=db.thresholds[1]?'中高風險':s.score>=db.thresholds[0]?'中風險':'低風險'}function cls(s){return s.complete<60?'unknown':level(s)==='高風險'?'high':level(s)==='低風險'?'low':'mid'}function status(s){return db.reviews[s.id]?.status||'待查核'}
function reasons(s){if(s.complete<60)return [{title:'缺少完整財務與收費資料',summary:'目前資料完整度只有 '+s.complete+'%，暫無法完整評估。',source:'資料來源完整度檢查',observation:'公開財務資料缺漏，部分收費欄位尚未更新。',rule:'資料完整度未達 60%，優先標示資料不足，不列為低風險。',action:'補齊年度財務報告與收費公告',items:['取得最新財務報告','確認收費公告及招生人數']}];if(s.score<40)return [{title:'目前未觸及主要風險條件',summary:'已取得資料未呈現重大差異，仍應依例行流程持續觀察。',source:'園所、裁罰及公開財務模擬資料',observation:'裁罰次數 0 次；收入差異 4%；資料完整度 '+s.complete+'%。',rule:'以裁罰紀錄、同類比較及跨來源差異交叉檢查。',action:'依例行排程確認資料',items:['確認資料更新日期','追蹤下一期公開資料']}];return [{title:'近一年有 2 次同類型裁罰',summary:'相同缺失重複出現，建議優先確認改善情形。',source:'公開裁罰資料（模擬）｜2026/02、2026/07',observation:'兩筆紀錄皆涉及人員配置，前次改善成果尚待確認。',rule:'近 12 個月同類型裁罰達 2 次以上，提高法遵風險。',action:'追蹤前次裁罰改善情形',items:['調閱前次改善計畫','確認複查結果及人員配置']},{title:'每生人事成本高於同類園所',summary:'本園每生 146,000 元，同類園所多為 72,000～98,000 元。',source:'2025 年度公開財務資料、園所基本資料（模擬）',observation:'比較範圍為同區域、同類型及相近招生規模的 12 間園所。',rule:'高於同類園所前 10% 高值範圍，提高財務風險。',action:'確認人員配置與人事支出',items:['比對員工名冊與薪資明細','確認臨時及外包人員費用'],compare:true},{title:'收入資料存在較大差異',summary:'收費推估年收入 600 萬元，財務申報為 920 萬元，差異約 53%。',source:'收費公告、招生人數、年度財務報告（模擬）',observation:'月費 5,000 元 × 100 人 × 12 個月 = 600 萬元；與申報差額 320 萬元。',rule:'跨來源推估與申報收入差異超過 20%，建議確認其他收入來源。',action:'確認收費與收入來源',items:['核對實際招生人數及月費','釐清延托、代辦及其他收入']},{title:'人事費增加快於學生人數',summary:'年度人事費由 1,043 萬增至 1,460 萬（約增加 40%），學生數約增加 5%。',source:'2024、2025 年度財務報告與招生資料（模擬）',observation:'支出增加 417 萬元；學生數由 95 人增至 100 人。',rule:'人事支出年增幅超過 30% 且高於學生增幅，列為年度變化異常。',action:'核對年度支出變化',items:['確認薪資調整及一次性支出','比對兩年度學生及員工人數']}].slice(0,s.score>=75?4:2)}
function dirty(){const f=$('#review-form');return f&&new FormData(f).get('dirty')==='yes'}function go(to,id){if(dirty()){openModal('尚未儲存覆核內容',`<p>離開後，本次未儲存的內容將不會保留。</p><div class="form-actions"><button onclick="closeModal()">繼續編輯</button><button class="primary" onclick="closeModal();navigate('${to}',${id??'null'})">放棄修改並離開</button></div>`);return}navigate(to,id)}function navigate(to,id){page=to;if(id!=null)selected=id;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+(to==='detail'?'overview':to)));render();scrollTo(0,0)}function render(){if(page==='overview')overview();else if(page==='detail')detail();else settings()}
function listData(){return schools.filter(s=>(!filters.q||(s.name+s.address).includes(filters.q))&&(!filters.district||s.district===filters.district)&&(!filters.risk||level(s)===filters.risk)&&(!metric||(metric==='high'?level(s)==='高風險':metric==='rising'?s.trend>=10:metric==='pending'?status(s)==='待查核':s.complete<60))).sort((a,b)=>filters.sort==='complete'?a.complete-b.complete:filters.sort==='trend'?b.trend-a.trend:(b.complete>=60?b.score:-1)-(a.complete>=60?a.score:-1))}
function setMetric(m){metric=metric===m?'':m;overview()}function setFilter(k,v){filters[k]=v;updateResults()}function resetFilters(){metric='';filters={q:'',district:'',risk:'',sort:'risk'};overview()}
function overview(){$('#page').innerHTML=`<div class="heading"><div><div class="eyebrow">風險監測</div><h1>今天，優先關注哪些園所？</h1><p>先看風險原因，再決定下一步查核。</p></div><span class="demo">共 ${schools.length} 間園所</span></div><div class="metrics">${[['high','高風險園所',schools.filter(s=>level(s)==='高風險').length,'建議優先確認','high'],['rising','本週風險升高',schools.filter(s=>s.trend>=10).length,'比上週增加 10 分以上','mid'],['pending','待人工覆核',schools.filter(s=>status(s)==='待查核').length,'尚未記錄處理結果',''],['missing','資料不足',schools.filter(s=>s.complete<60).length,'待補充後再評估','unknown']].map(([key,title,note,sub,c])=>`<button class="metric ${metric===key?'active':''}" aria-pressed="${metric===key}" onclick="setMetric('${key}')"><span>${title}</span><span class="arrow">↗</span><strong class="${c}">${note}<span class="muted"> 間</span></strong><small>${sub}</small></button>`).join('')}</div><div class="panel"><div class="panel-head"><div><h2>園所風險分布</h2><p>點選地圖標記看摘要，或從右側清單進入詳情。</p></div><div class="legend"><span class="high"><i class="dot"></i>高風險</span><span class="mid"><i class="dot"></i>中／中高</span><span class="low"><i class="dot"></i>低風險</span><span class="unknown"><i class="dot"></i>資料不足</span></div></div><div class="filters"><input class="search" aria-label="搜尋園所或地址" placeholder="搜尋園所名稱或地址…" value="${esc(filters.q)}" oninput="setFilter('q',this.value)"><select aria-label="行政區" onchange="setFilter('district',this.value)">${options(['全部行政區',...districts],filters.district,true)}</select><select aria-label="風險等級" onchange="setFilter('risk',this.value)">${options(['全部風險','高風險','中高風險','中風險','低風險','資料不足'],filters.risk,true)}</select><button class="link" onclick="resetFilters()">清除篩選</button></div><div class="workspace"><div class="map" aria-label="模擬園所風險地圖"><svg viewBox="0 0 620 480" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="blocks" width="75" height="65" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><rect width="75" height="65" fill="#e9ede6"/><rect x="7" y="7" width="60" height="50" rx="5" fill="#f5f4ef" stroke="#e1e4db"/></pattern></defs><rect width="620" height="480" fill="url(#blocks)"/><path d="M420 -40 C260 65 440 120 300 220 S320 350 130 520" fill="none" stroke="#b9d9e1" stroke-width="54"/><path d="M-20 155L650 315 M70 -20L550 500 M-20 395L650 90" stroke="#e2ded0" stroke-width="19"/><path d="M-20 155L650 315 M70 -20L550 500 M-20 395L650 90" stroke="#fffefa" stroke-width="13"/><path d="M-20 70L630 190 M-20 270L650 425" stroke="#fffefa" stroke-width="8"/><path d="M40 390Q80 340 150 365L175 420L80 450Z M460 20L560 30L580 90L475 105Z" fill="#cbdcc7"/></svg><span class="map-label" style="left:18%;top:35%">板橋區</span><span class="map-label" style="right:10%;top:50%">中和區</span><div id="markers"></div><div id="map-popup"></div><span class="map-chip">模擬位置示意 · 非實際地理座標</span></div><div class="list"><div class="list-head"><span id="result-count"></span><select aria-label="排序方式" style="padding:2px 5px;border:0;background:transparent;font-size:12px" onchange="setFilter('sort',this.value)"><option value="risk" ${filters.sort==='risk'?'selected':''}>風險由高至低</option><option value="trend" ${filters.sort==='trend'?'selected':''}>風險升幅最大</option><option value="complete" ${filters.sort==='complete'?'selected':''}>資料最不完整</option></select></div><div id="results"></div></div></div></div><div class="notice">資料不足不等於低風險。風險分數僅供查核排序，實際情況仍需承辦人確認。</div><p class="note">評估快照：2026/09/12 08:30 · 規則版本 1.2 · 設定與覆核內容會保存在此瀏覽器。</p>`;updateResults()}
function updateResults(){const data=listData();$('#result-count').textContent=`${metric?'已套用統計篩選 · ':''}顯示 ${data.length} 間園所`;$('#results').innerHTML=data.length?data.map(s=>`<button class="school-row" onclick="go('detail',${s.id})"><span class="score ${cls(s)}">${s.complete<60?'—':s.score}</span><span class="row-info"><strong>${esc(s.name)}</strong> <span class="pill ${cls(s)}">${level(s)}</span><p>${esc(s.district)} · ${reasons(s)[0].title}</p><small>${status(s)} · 資料完整度 ${s.complete}%</small></span><span class="row-right"><b>${s.trend>0?'↑ '+s.trend:s.trend<0?'↓ '+Math.abs(s.trend):'—'}</b>較上週<br>查看詳情 ›</span></button>`).join(''):`<div class="empty"><h3>找不到符合條件的園所</h3><p>試試其他關鍵字，或清除篩選。</p><button style="margin-top:15px" onclick="resetFilters()">顯示全部園所</button></div>`;$('#markers').innerHTML=data.map(s=>`<button aria-label="${esc(s.name)} ${s.complete<60?'資料不足':s.score+' 分'}" class="marker ${cls(s)}" style="left:${s.x}%;top:${s.y}%" onclick="showPopup(${s.id})"><strong>${s.complete<60?'—':s.score}</strong><small>${esc(s.name)}</small></button>`).join('');$('#map-popup').innerHTML=''}
function showPopup(id){const s=schools[id];$('#map-popup').innerHTML=`<div class="popup"><button class="link close" aria-label="關閉園所摘要" onclick="$('#map-popup').innerHTML=''">×</button><h3>${esc(s.name)}</h3><small>${esc(s.address)}（模擬）</small><p style="margin-top:8px"><b class="${cls(s)}">${s.complete<60?'暫無法完整評估':s.score+' 分'} · ${level(s)}</b></p><ul>${reasons(s).slice(0,2).map(r=>`<li>${r.title}</li>`).join('')}</ul><small>資料完整度 ${s.complete}% · ${status(s)}</small><button class="primary" onclick="go('detail',${id})">查看完整風險詳情 →</button></div>`}
function options(values,value,firstEmpty=false){return values.map((s,i)=>`<option value="${firstEmpty&&i===0?'':esc(s)}" ${(firstEmpty&&i===0?'':s)===value?'selected':''}>${esc(s)}</option>`).join('')}
function detail(){const s=schools[selected],rs=reasons(s),r=db.reviews[s.id]||{},parts=s.id===0?[36,27,12,7]:[Math.round(s.score*.4),Math.round(s.score*.35),Math.round(s.score*.15),0];if(s.id!==0)parts[3]=s.score-parts.slice(0,3).reduce((a,b)=>a+b,0);$('#page').innerHTML=`<div class="breadcrumb"><button class="link" onclick="go('overview')">← 返回風險總覽</button>　／　${esc(s.name)}</div><div class="heading"><div><h1>${esc(s.name)}</h1><p>${esc(s.type)} · ${esc(s.district)} · 核定 ${s.capacity} 人</p><p>${esc(s.address)}（模擬地址）</p></div><button class="primary" onclick="arrange()">安排查核</button></div><div class="detail-grid"><div><div class="panel pad"><div class="summary"><div><small>綜合風險分數</small><div class="score-big ${cls(s)}">${s.complete<60?'—':s.score}<small>${s.complete<60?'':' / 100'}</small></div><span class="pill ${cls(s)}">${level(s)}</span></div><div><h3>${s.complete<60?'先補齊資料，再進行評估':s.score>=75?'建議優先確認下列風險原因':'依風險原因安排後續確認'}</h3><p class="muted" style="font-size:13px;margin-top:8px">資料完整度 ${s.complete}% · <span id="detail-status">${status(s)}</span></p><small>資料更新：2026/09/12 08:30 · 評估規則 1.2</small></div></div>${['法遵／裁罰／評鑑','財務／收費','資料一致性','輿情預警'].map((t,i)=>`<div class="bar-row"><span>${t}</span><div class="bar"><i style="width:${s.complete<60?0:parts[i]/[40,35,15,10][i]*100}%"></i></div><span>${s.complete<60?'待補':parts[i]+'/'+[40,35,15,10][i]}</span></div>`).join('')}${s.complete<60?'<div class="notice" style="margin-top:16px">資料不足，暫無法完整評估。請優先補齊財務與收費資料。</div>':''}</div><div class="panel"><div class="panel-head"><div><h2>為什麼需要${s.score<40&&s.complete>=60?'持續':'優先'}關注？</h2><p>每一項原因，都能查看資料與判斷方式。</p></div></div>${rs.map((a,i)=>`<div class="reason"><span class="number">${i+1}</span><div><h3>${a.title}</h3><p>${a.summary}</p><button class="link" onclick="evidence(${i})">查看判斷依據 ↗</button></div></div>`).join('')}</div><div class="panel"><div class="panel-head"><div><h2>AI 輔助查核建議</h2><p>依上方風險整理的模擬建議，可勾選已確認項目。</p></div><span class="pill">待人工確認</span></div><div class="pad">${rs.map((a,i)=>`<h3 style="margin-top:${i?20:0}px">${i+1}. ${a.action}</h3>${a.items.map((item,j)=>`<label class="check"><input type="checkbox" ${r.checks?.includes(i+'-'+j)?'checked':''} onchange="saveCheck('${i}-${j}',this.checked)">${item}</label>`).join('')}`).join('')}<div class="notice" style="margin-top:20px">AI 分析內容僅供稽查排序及輔助判斷，不作為違法認定或行政裁處之直接依據。</div></div></div></div><div><div class="panel"><div class="panel-head"><div><h2>人工覆核</h2><p>記錄判斷，讓下一步清楚可追蹤。</p></div></div><form id="review-form" class="pad" oninput="this.elements.dirty.value='yes'" onsubmit="saveReview(event)"><input name="dirty" type="hidden" value="no"><div class="field"><label for="review-status">處理狀態</label><select id="review-status" name="status" onchange="$('#review-date').required=this.value==='已排入查核'">${options(['待查核','已排入查核','持續觀察','已確認無異常','資料不足待補充'],r.status||'待查核')}</select></div><div class="field" style="margin-top:14px"><label for="review-owner">承辦人 *</label><input id="review-owner" name="owner" required value="${esc(r.owner||'林承辦')}" maxlength="40"></div><div class="field" style="margin-top:14px"><label for="review-date">查核日期（已排入查核時必填）</label><input id="review-date" name="date" type="date" ${r.status==='已排入查核'?'required':''} value="${esc(r.date||'')}"></div><div class="field" style="margin-top:14px"><label for="review-note">承辦人備註</label><textarea id="review-note" name="note" placeholder="說明目前判斷與需留意的情況">${esc(r.note||'')}</textarea></div><div class="field" style="margin-top:14px"><label for="review-next">後續處理事項</label><textarea id="review-next" name="next" placeholder="例如：請園所補充人員名冊及薪資明細">${esc(r.next||'')}</textarea></div><button class="primary" style="width:100%;margin-top:18px">儲存覆核結果</button><div id="review-saved" class="save-info">${r.saved?'上次儲存：'+esc(r.saved):'尚未儲存覆核紀錄'}</div><small>儲存於此瀏覽器，重新整理後仍保留。</small></form></div><div class="notice">輿情僅是預警線索，不能直接作為違法判定依據。</div></div></div>`}
function saveCheck(key,on){const r=db.reviews[selected]||{};r.checks=on?[...new Set([...(r.checks||[]),key])]:(r.checks||[]).filter(k=>k!==key);db.reviews[selected]=r;persist();toast(on?'已記錄為確認完成':'已取消確認')}
function saveReview(e){e.preventDefault();const f=e.target,data=Object.fromEntries(new FormData(f));delete data.dirty;db.reviews[selected]={...db.reviews[selected],...data,saved:new Date().toLocaleString('zh-TW')};const ok=persist();f.elements.dirty.value='no';$('#detail-status').textContent=data.status;$('#review-saved').textContent='上次儲存：'+db.reviews[selected].saved;if(ok)toast('已儲存覆核結果');}
function arrange(){const f=$('#review-form');f.elements.status.value='已排入查核';f.elements.dirty.value='yes';f.elements.date.required=true;f.scrollIntoView({behavior:'smooth',block:'center'});f.elements.date.focus();toast('請填寫查核日期，再儲存覆核結果')}
function openModal(title,body){$('#modal').innerHTML=`<div class="dialog-head"><h2 id="modal-title">${title}</h2><button type="button" aria-label="關閉彈窗" onclick="closeModal()">×</button></div><div class="dialog-body">${body}</div>`;$('#modal').showModal()}function closeModal(){$('#modal').close()}
function evidence(i){const s=schools[selected],r=reasons(s)[i];openModal('判斷依據',`<div class="eyebrow">${esc(s.name)} · 評估規則版本 1.2</div><h2 style="margin-bottom:20px">${r.title}</h2><div class="evidence-block"><small>資料來源</small><p>${r.source}</p></div><div class="evidence-block"><small>系統觀察到的資料</small><p>${r.observation}</p>${r.compare?'<div class="compare"><div><small>本園每生人事費</small><strong>146,000 元</strong></div><div><small>同類園所多數範圍</small><strong style="font-size:18px">72,000～98,000 元</strong></div></div>':''}</div><div class="evidence-block"><small>本項判斷規則</small><p>${r.rule}</p></div><div class="evidence-block"><small>對評估的影響</small><p>${s.complete<60?'暫不給予完整風險等級，優先補齊資料。':s.score<40?'本項未觸及主要風險條件，持續觀察。':'列為需要進一步確認的風險訊號，納入優先查核參考。'}</p></div><div class="notice">以上為 Demo 模擬依據，異常差異不等同違法。</div><div class="form-actions"><button class="primary" onclick="closeModal()">返回園所詳情</button></div>`)}
function settings(){$('#page').innerHTML=`<div class="heading"><div><div class="eyebrow">資料管理</div><h1>資料與規則設定</h1><p>管理資料欄位、判斷方式與來源，保留每次規則修改紀錄。</p></div></div><div class="tabs" role="tablist">${[['fields','資料欄位'],['rules','風險判斷規則'],['sources','資料來源']].map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'active':''}" onclick="tab='${k}';settings()">${t}</button>`).join('')}</div>${tab==='fields'?fieldsPanel():tab==='rules'?rulesPanel():sourcesPanel()}<p class="note">本頁修改會保存在此瀏覽器。園所分數與判斷依據使用固定展示快照，規則編輯不會重新計算快照。</p>`}
function fieldsPanel(){return `<div class="panel"><div class="panel-head"><div><h2>資料欄位 <small>共 ${db.fields.length} 個</small></h2><p>決定要蒐集哪些資料，以及資料的用途。</p></div><button class="primary" onclick="editField()">＋ 新增資料欄位</button></div><div class="table-wrap"><table><thead><tr><th>欄位名稱</th><th>類型／單位</th><th>資料來源</th><th>參與風險</th><th>詳情顯示</th><th>操作</th></tr></thead><tbody>${db.fields.map((f,i)=>`<tr><td><b>${esc(f.name)}</b></td><td>${esc(f.type)}／${esc(f.unit||'—')}</td><td>${esc(f.source)}</td><td>${f.risk?'是':'否'}</td><td>${f.show?'是':'否'}</td><td><button class="link" onclick="editField(${i})">編輯欄位</button></td></tr>`).join('')}</tbody></table></div></div>`}
function editField(i){const f=i==null?{name:'',type:'數字',source:db.sources[0].name,unit:'',risk:true,show:true}:db.fields[i];openModal(i==null?'新增資料欄位':'編輯資料欄位',`<form onsubmit="submitField(event,${i??'null'})"><div class="form-error" id="form-error" role="alert"></div><div class="form-grid"><label class="field full">欄位名稱 *<input name="name" required maxlength="40" placeholder="例如：年度餐費" value="${esc(f.name)}"></label><label class="field">欄位類型<select name="type">${options(['數字','金額','文字','日期','是／否'],f.type)}</select></label><label class="field">單位<input name="unit" maxlength="12" placeholder="例如：元、人、次" value="${esc(f.unit)}"></label><label class="field full">資料來源<select name="source">${options(db.sources.map(s=>s.name),f.source)}</select></label></div><label class="check"><input type="checkbox" name="risk" ${f.risk?'checked':''}>參與風險判斷</label><label class="check"><input type="checkbox" name="show" ${f.show?'checked':''}>顯示於園所詳情</label><div class="notice">此處保存欄位設定；新增欄位尚無園所資料，正式匯入後才會出現在評估中。</div><div class="form-actions"><button type="button" onclick="closeModal()">取消</button><button class="primary">儲存欄位</button></div></form>`)}
function submitField(e,i){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.name=f.name.trim();if(!f.name||db.fields.some((x,j)=>x.name===f.name&&j!==i)){$('#form-error').textContent='請填寫不重複的欄位名稱。';return}f.risk=!!f.risk;f.show=!!f.show;if(i==null)db.fields.push(f);else db.fields[i]=f;const ok=persist();closeModal();settings();if(ok)toast('已儲存資料欄位')}
function rulesPanel(){return `<div class="panel"><div class="panel-head"><div><h2>風險判斷規則 <span class="pill">設定版本 1.${db.version}</span></h2><p>用白話設定判斷條件。園所目前仍使用 1.2 版評估快照。</p></div><button onclick="historyModal()">查看修改紀錄</button></div><div class="table-wrap"><table><thead><tr><th>規則名稱／判斷條件</th><th>風險構面</th><th>影響程度</th><th>狀態</th><th>操作</th></tr></thead><tbody>${db.rules.map((r,i)=>`<tr><td><b>${esc(r.name)}</b><p class="muted" style="font-size:12px;max-width:390px">${esc(r.condition)}</p></td><td>${esc(r.dimension)}</td><td>${esc(r.impact)}影響</td><td><button class="switch ${r.enabled?'':'off'}" aria-pressed="${r.enabled}" onclick="toggleRule(${i})">${r.enabled?'已啟用':'已停用'}</button></td><td><button class="link" onclick="editRule(${i})">編輯規則</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="panel-head"><div><h2>風險等級門檻</h2><p>資料完整度未達 60% 一律顯示資料不足。</p></div><button onclick="thresholdModal()">調整門檻</button></div><div class="pad legend"><span class="low">低風險 0–${db.thresholds[0]-1}</span><span class="mid">中風險 ${db.thresholds[0]}–${db.thresholds[1]-1}</span><span class="mid">中高風險 ${db.thresholds[1]}–${db.thresholds[2]-1}</span><span class="high">高風險 ${db.thresholds[2]}–100</span></div></div>`}
function logChange(text,date='2026-09-12'){db.version++;db.history.unshift({version:'1.'+db.version,text,date,at:new Date().toLocaleString('zh-TW'),by:'林承辦'});return persist()}
function toggleRule(i){db.rules[i].enabled=!db.rules[i].enabled;const ok=logChange((db.rules[i].enabled?'啟用':'停用')+'「'+db.rules[i].name+'」');settings();if(ok)toast('已更新設定並保留版本；評估快照不變')}
function editRule(i){const r=db.rules[i];openModal('編輯風險判斷規則',`<form onsubmit="submitRule(event,${i})"><div class="form-grid"><label class="field full">規則名稱 *<input name="name" required value="${esc(r.name)}"></label><label class="field full">所屬風險構面<select name="dimension">${options(['法遵／裁罰／評鑑','財務／收費','資料／營運一致性','輿情預警'],r.dimension)}</select></label><label class="field full">判斷條件 *<textarea name="condition" required>${esc(r.condition)}</textarea></label><label class="field">風險影響程度<select name="impact">${options(['低','中','高'],r.impact)}</select></label><label class="field">生效日期 *<input name="date" required type="date" value="${r.date}"></label></div><label class="check"><input name="enabled" type="checkbox" ${r.enabled?'checked':''}>啟用這條規則</label><div class="notice">儲存後新增設定版本，保留修改時間與修改者。此 Demo 不重新計算園所快照。</div><div class="form-actions"><button type="button" onclick="closeModal()">取消</button><button class="primary">儲存新版本</button></div></form>`)}
function submitRule(e,i){e.preventDefault();const r=Object.fromEntries(new FormData(e.target));r.enabled=!!r.enabled;db.rules[i]=r;const ok=logChange('修改「'+r.name+'」：'+r.condition+'；'+r.impact+'影響；'+(r.enabled?'啟用':'停用'),r.date);closeModal();settings();if(ok)toast('已儲存新版本 1.'+db.version)}
function historyModal(){openModal('規則修改紀錄',`${db.history.map(h=>`<div class="history"><b>版本 ${h.version} · ${esc(h.by)}</b><p>${esc(h.at)} · 生效日期 ${esc(h.date)}</p><div>${esc(h.text)}</div></div>`).join('')}<div class="history"><b>版本 1.2 · 初始展示版本</b><p>2026/09/12 · 系統管理員</p>建立四大風險構面與判斷條件，作為目前園所評估快照。</div><div class="form-actions"><button class="primary" onclick="closeModal()">完成</button></div>`)}
function thresholdModal(){openModal('調整風險等級門檻',`<form onsubmit="saveThresholds(event)"><p class="muted" style="margin-bottom:18px">調整後，總覽會依現有分數更新風險等級與統計數量。</p><div id="form-error" class="form-error" role="alert"></div><div class="form-grid">${['中風險起始分數','中高風險起始分數','高風險起始分數'].map((t,i)=>`<label class="field full">${t}<input name="t${i}" type="number" min="1" max="100" required value="${db.thresholds[i]}"></label>`).join('')}</div><div class="form-actions"><button type="button" onclick="closeModal()">取消</button><button class="primary">儲存門檻</button></div></form>`)}function saveThresholds(e){e.preventDefault();const v=[0,1,2].map(i=>Number(e.target.elements['t'+i].value));if(!(v[0]<v[1]&&v[1]<v[2])){$('#form-error').textContent='分數需依序遞增：中風險 < 中高風險 < 高風險。';return}db.thresholds=v;const ok=logChange('風險等級門檻調整為 '+v.join('／')+' 分');closeModal();settings();if(ok)toast('已更新風險等級門檻與總覽分類')}
function sourcesPanel(){return `<div class="panel"><div class="panel-head"><div><h2>資料來源 <small>共 ${db.sources.length} 個</small></h2><p>確認資料是否齊全，以及最近一次更新狀態。</p></div></div><div class="table-wrap"><table><thead><tr><th>資料來源</th><th>資料筆數</th><th>最後更新</th><th>狀態</th><th>操作</th></tr></thead><tbody>${db.sources.map((s,i)=>`<tr><td><b>${esc(s.name)}</b><br><small>模擬資料</small></td><td>${s.count} 筆</td><td>${esc(s.updated)}</td><td><span class="pill ${s.status==='正常'?'low':'mid'}">${s.status}</span></td><td><button class="link" onclick="sourceModal(${i})">查看來源詳情</button></td></tr>`).join('')}</tbody></table></div></div>`}
function sourceModal(i){const s=db.sources[i];openModal('資料來源詳情',`<h2>${esc(s.name)}</h2><div class="compare"><div><small>資料筆數</small><strong>${s.count} 筆</strong></div><div><small>目前狀態</small><strong style="font-size:18px">${s.status}</strong></div></div><div class="evidence-block" style="margin-top:20px"><small>最後更新</small><p>${esc(s.updated)}</p></div><div class="evidence-block"><small>來源說明</small><p>${esc(s.note)}</p></div><div class="notice">此按鈕僅模擬檢查更新時間，不會連線抓取或補齊資料。</div><div class="form-actions"><button onclick="closeModal()">關閉</button><button class="primary" onclick="refreshSource(${i})">模擬檢查更新</button></div>`)}function refreshSource(i){db.sources[i].updated=new Date().toLocaleString('zh-TW');const ok=persist();closeModal();settings();if(ok)toast('已模擬檢查更新；資料筆數與完整度維持原狀')}
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});render();
</script><script>
/* Audit workflow and signed PDF export. All records remain local to this browser. */
db.casework ||= {}; db.profile ||= {name:'',department:'',title:'承辦人',signature:''}; db.imports ||= []; db.importedSchools ||= []; db.schoolData ||= {};
const auditBaseRender=render, auditBaseSave=saveReview, auditBaseDetail=detail;
const savedOpenModal=openModal;
openModal=function(title,body){$('#modal').className='';savedOpenModal(title,body)};
const isoToday=()=>new Date().toLocaleDateString('en-CA');
const stamp=()=>new Date().toLocaleString('zh-TW');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
const schoolById=id=>schools.find(s=>s.id===Number(id));
const auditNav=document.createElement('button');auditNav.id='nav-audit';auditNav.textContent='☷　稽核管理';auditNav.onclick=()=>go('audit');$('nav').insertBefore(auditNav,$('#nav-settings'));
let auditFilter='open',auditSearch='',caseId=null,exportDraft=null,reportPages=[],signatureDraft='';
function ensureCase(id){if(!db.casework[id]){const r=db.reviews[id];db.casework[id]={agency:'',owner:r?.owner||'',due:r?.date||'',stage:r?.status==='已確認無異常'&&!r?.next?'已完成':'待處理',notes:'',actions:r?.next?[{id:uid(),title:r.next,owner:r.owner||'',due:r.date||'',status:'待處理',note:''}]:[],timeline:[{at:r?.saved||stamp(),text:'已建立稽核案件，承接人工覆核結果。'}]}}return db.casework[id]}
for(const [id,r] of Object.entries(db.reviews))if(r.saved)ensureCase(id);
render=function(){if(page==='audit')auditPage();else if(page==='case')casePage();else auditBaseRender()};
const auditBaseNavigate=navigate;
navigate=function(to,id){if(to==='case')caseId=Number(id);auditBaseNavigate(to,id);if(to==='case'){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-audit'))}};
saveReview=function(e){auditBaseSave(e);const r=db.reviews[selected],c=ensureCase(selected);c.owner=r.owner;c.due=r.date||c.due;if(r.next&&!c.actions.some(a=>a.title===r.next))c.actions.push({id:uid(),title:r.next,owner:r.owner,due:r.date||'',status:'待處理',note:''});c.timeline.unshift({at:stamp(),text:`更新人工覆核：${r.status}。承辦：${r.owner}。後續事項：${r.next||'未填寫'}`});persist();toast('覆核已儲存，已同步至稽核管理');if(!$('#audit-link')){const b=document.createElement('button');b.id='audit-link';b.type='button';b.className='link';b.style.marginTop='12px';b.textContent='前往稽核管理，追蹤後續行動 →';b.onclick=()=>go('case',selected);$('#review-form').append(b)}};
detail=function(){auditBaseDetail();if(db.reviews[selected]?.saved){const b=document.createElement('button');b.type='button';b.id='audit-link';b.className='link';b.style.marginTop='12px';b.textContent='前往稽核管理，追蹤後續行動 →';b.onclick=()=>go('case',selected);$('#review-form').append(b)}const d=db.schoolData[selected];if(d){const div=document.createElement('div');div.className='panel pad';div.innerHTML=`<h2>最近匯入資料</h2><p class="muted">${esc(d.file)} · ${esc(d.at)}</p><div class="data-summary"><dl>${Object.entries(d.values).map(([k,v])=>`<dt>${esc(importFieldLabel(k))}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div><small>已匯入資料尚未重新計算風險分數。</small>`;$('.detail-grid>div').append(div)}};
function auditRecords(){return schools.filter(s=>db.reviews[s.id]?.saved).map(s=>({s,r:db.reviews[s.id],c:ensureCase(s.id)}))}
function pendingActions(c){return c.actions.filter(a=>a.status!=='已完成')}
function overdue(c){return c.stage!=='已完成'&&((c.due&&c.due<isoToday())||pendingActions(c).some(a=>a.due&&a.due<isoToday()))}
function auditPage(){const all=auditRecords();$('#page').innerHTML=`<div class="heading"><div><div class="eyebrow">人工覆核 → 後續調查</div><h1>稽核管理</h1><p>掌握誰要處理、接下來做什麼，以及何時完成。</p></div><div class="toolbar"><button onclick="profileModal()">${db.profile.signature?'管理個人簽名':'設定個人簽名'}</button></div></div><div class="metrics audit-metrics">${[['open','待處理／調查中',all.filter(x=>x.c.stage!=='已完成').length],['overdue','已逾期',all.filter(x=>overdue(x.c)).length],['done','已完成',all.filter(x=>x.c.stage==='已完成').length]].map(([key,label,n])=>`<button class="metric ${auditFilter===key?'active':''}" onclick="auditFilter='${key}';auditPage()"><span>${label}</span><strong>${n}<span> 件</span></strong></button>`).join('')}</div><div class="panel"><div class="panel-head"><div><h2>已覆核園所與後續行動</h2><p>儲存人工覆核後，園所會自動出現在這裡。</p></div><span class="pill">共 ${all.length} 件</span></div><div class="filters"><input class="search" aria-label="搜尋稽核案件" value="${esc(auditSearch)}" placeholder="搜尋園所、負責人或交辦局處" oninput="auditSearch=this.value;renderAuditRows()"><select aria-label="案件篩選" onchange="auditFilter=this.value;auditPage()">${[['open','未完成案件'],['all','全部案件'],['overdue','逾期案件'],['done','已完成案件']].map(([v,t])=>`<option value="${v}" ${auditFilter===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="audit-rows"></div></div><div class="notice">示範流程：查看案件 → 更新後續行動 → 確認簽名 → 預覽交辦 PDF。點擊「！」了解各功能用途。</div>`;renderAuditRows()}
function renderAuditRows(){const records=auditRecords().filter(x=>(auditFilter==='all'||(auditFilter==='open'&&x.c.stage!=='已完成')||(auditFilter==='done'&&x.c.stage==='已完成')||(auditFilter==='overdue'&&overdue(x.c)))&&(!auditSearch||(x.s.name+x.c.owner+x.c.agency).includes(auditSearch))).sort((a,b)=>(a.c.due||'9999').localeCompare(b.c.due||'9999'));$('#audit-rows').innerHTML=records.length?`<div class="table-wrap"><table class="audit-table"><thead><tr><th>園所／覆核結果</th><th>下一步行動</th><th>負責人／局處</th><th>期限</th><th>案件狀態</th><th>操作</th></tr></thead><tbody>${records.map(({s,r,c})=>`<tr><td><button class="link" onclick="go('case',${s.id})">${esc(s.name)}</button><p class="muted">${esc(r.status)}</p></td><td><p style="max-width:280px">${esc(pendingActions(c)[0]?.title||(c.stage==='已完成'?'已完成後續處理':'尚未新增行動，請補上'))}</p><small>${pendingActions(c).length} 項待完成</small></td><td>${esc(c.owner||'未指派')}<p class="muted">${esc(c.agency||'尚未指定局處')}</p></td><td>${esc(c.due||'未設定')}<p class="due">${overdue(c)?'已逾期':''}</p></td><td><span class="action-status ${c.stage==='已完成'?'done':''}">${esc(c.stage)}</span></td><td><div class="toolbar"><button class="link" onclick="go('case',${s.id})">管理調查</button><button class="link" onclick="exportModal(${s.id})">匯出 PDF</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>${auditRecords().length?'沒有符合條件的案件':'尚無已覆核案件'}</h3><p>${auditRecords().length?'調整篩選或搜尋條件，再試一次。':'先到園所詳情儲存人工覆核，即可在此追蹤後續處理。'}</p><button style="margin-top:14px" onclick="go('overview')">前往風險總覽</button></div>`}

function seedAudit(){const examples=[{id:0,status:'已排入查核',stage:'調查中',date:'2026-09-18',next:'調閱人員名冊與年度薪資明細',agency:'新北市政府教育局'},{id:1,status:'持續觀察',stage:'待處理',date:'2026-09-20',next:'確認收費公告與實際收費項目',agency:'新北市政府教育局'},{id:18,status:'資料不足待補充',stage:'待補件',date:'2026-09-25',next:'請園所補充年度財務報告與收費公告',agency:'新北市政府教育局'}];let n=0;for(const x of examples){if(db.reviews[x.id]?.saved)continue;db.reviews[x.id]={status:x.status,owner:'示範承辦人',date:x.date,next:x.next,note:'【示範案件】僅供操作展示，非真實查核紀錄。',saved:stamp(),demo:true};const c=ensureCase(x.id);c.stage=x.stage;c.agency=x.agency;n++}const ok=persist();closeModal();auditPage();if(ok)toast(`已新增 ${n} 件示範案件`)}

function normalized(v){return String(v??'').trim().replace(/[\s_\-\/（）()：:]/g,'').replace(/\[.*?\]/g,'').toLowerCase()}

 preview:{title:'先確認，再匯入',intro:'將辨識結果攤開給承辦人檢查，確保匯入的是正確園所與資料。',steps:['逐列查看資料；可修改內容或取消個別資料列。','同名且同行政區會標示更新，新的園所會標示新增。','必填內容缺漏或格式有問題時，提醒使用者修正。','確認後保留本次匯入來源與結果，方便追溯。']},
 history:{title:'處理紀錄與追蹤',intro:'保留從覆核、交辦到後續調查的處理過程。',steps:['記錄何時更新案件、行動與處理結果。','案件由其他承辦人接手時，可快速了解前情。','示範 PDF 匯出也會記錄在案件中。']},
 assignment:{title:'交辦與案件資訊',intro:'清楚指定這個案件由誰負責，以及接下來應交給哪個局處。',steps:['填寫對應局處、負責人與期限。','依進度更新待處理、調查中、待補件或已完成。','填寫調查摘要，作為後續交辦與回覆的依據。']}

const helpDialog=document.createElement('dialog');helpDialog.id='help-dialog';helpDialog.setAttribute('aria-labelledby','help-title');document.body.append(helpDialog);
function showFunctionHelp(key){const h=functionHelp[key];helpDialog.innerHTML=`<div class="dialog-head"><h2 id="help-title">${h.title}</h2><button aria-label="關閉功能說明" onclick="document.getElementById('help-dialog').close()">×</button></div><div class="dialog-body"><p>${h.intro}</p><div class="help-steps">${h.steps.map((t,i)=>`<div><span class="number">${i+1}</span><p>${t}</p></div>`).join('')}</div><div class="notice">${h.note||'展示模式：本頁使用模擬園所與案件資料，供功能介紹與操作體驗。'}</div><div class="form-actions"><button class="primary" onclick="document.getElementById('help-dialog').close()">了解了，繼續體驗</button></div></div>`;helpDialog.showModal()}
function helpIcon(key){const b=document.createElement('button');b.type='button';b.className='help-icon';b.textContent='!';b.setAttribute('aria-label',functionHelp[key].title+' 功能說明');b.title='點擊了解功能';b.onclick=e=>{e.stopPropagation();showFunctionHelp(key)};return b}
function addFunctionHelp(){document.querySelectorAll('#page h1,#page h2,#page h3,#modal h2').forEach(h=>{if(h.querySelector('.help-icon'))return;const text=h.textContent;let key;if(text==='稽核管理')key='audit';else if(text.includes('後續調查')||text==='新增後續行動'||text==='編輯後續行動')key='action';else if(text.includes('簽名')&&!text.includes('PDF'))key='signature';else if(text.includes('PDF'))key='pdf';else if(text.includes('這次要匯入')||text==='資料與規則設定'&&tab==='import')key='import';else if(text.includes('AI 已整理'))key='mapping';else if(text.includes('確認整理後'))key='preview';else if(text==='處理紀錄')key='history';else if(text.includes('交辦與案件資訊'))key='assignment';if(key)h.append(helpIcon(key))});document.querySelectorAll('#page .heading .toolbar').forEach(bar=>{if(bar.querySelector('[onclick*="exportModal"]')&&!bar.querySelector('.help-icon'))bar.append(helpIcon('pdf'))})}
const demoRender=render;render=function(){demoRender();addFunctionHelp()};
const demoSettings=settings;settings=function(){demoSettings();addFunctionHelp()};
const demoImportRender=renderImport;renderImport=function(){demoImportRender();addFunctionHelp()};
const demoCasePage=casePage;casePage=function(){demoCasePage();addFunctionHelp()};
const demoAuditPage=auditPage;auditPage=function(){demoAuditPage();addFunctionHelp()};
const demoOpenModal=openModal;openModal=function(title,body){demoOpenModal(title,body);addFunctionHelp()};
if(!db.demoWorkflowSeeded){for(const x of [{id:0,status:'已排入查核',stage:'調查中',date:'2026-09-18',next:'調閱人員名冊與年度薪資明細'},{id:1,status:'持續觀察',stage:'待處理',date:'2026-09-20',next:'確認收費公告與實際收費項目'},{id:18,status:'資料不足待補充',stage:'待補件',date:'2026-09-25',next:'請園所補充年度財務報告與收費公告'}]){if(db.reviews[x.id]?.saved)continue;db.reviews[x.id]={status:x.status,owner:'示範承辦人',date:x.date,next:x.next,note:'【示範案件】此為假資料，供展示後續調查與交辦流程。',saved:stamp(),demo:true};const c=ensureCase(x.id);c.stage=x.stage;c.agency='新北市政府教育局'}db.demoWorkflowSeeded=true;persist()}
if(!db.profile.signature&&!db.profile.name){db.profile={name:'示範承辦人',department:'新北市政府教育局',title:'承辦人',signature:demoSignature()};persist()}
tab='import';render();
