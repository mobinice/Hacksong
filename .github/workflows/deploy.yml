name: Deploy to AWS EC2

on:
  push:
    tags:
      - 'deploy_*'

jobs:
  deploy:
    name: Deploy to EC2 (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Deploy Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          cat << 'SSH_CONFIG' > ~/.ssh/config
          Host *
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
          SSH_CONFIG
          chmod 600 ~/.ssh/config

      - name: Verify SSH Connection
        run: |
          ssh -o BatchMode=yes ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'SSH connection successful! Host uptime:' && uptime"

      - name: Deploy Code via Rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new" \
            --exclude='.git*' \
            --exclude='RESTORE*' \
            --exclude='*restore*' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='.env*' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_TARGET_DIR }}/

      - name: Set Permissions and Reload Services
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'REMOTE_SCRIPT'
            sudo chown -R ubuntu:ubuntu ${{ secrets.EC2_TARGET_DIR }}
            sudo systemctl daemon-reload
            sudo systemctl restart youan-radar-api.service
            sudo systemctl reload nginx
            echo "Nginx and youan-radar-api service restarted successfully."
          REMOTE_SCRIPT

      - name: Health Check (Frontend & Backend API)
        run: |
          echo "1. Checking Frontend HTTP status at http://${{ secrets.EC2_HOST }}/ ..."
          FE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/)
          echo "Frontend status: $FE_STATUS"
          if [ "$FE_STATUS" -ne 200 ] && [ "$FE_STATUS" -ne 304 ]; then
            echo "Frontend health check failed with status $FE_STATUS"
            exit 1
          fi

          echo "2. Checking Backend API status at http://${{ secrets.EC2_HOST }}/api/schools ..."
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/api/schools)
          echo "API status: $API_STATUS"
          if [ "$API_STATUS" -ne 200 ]; then
            echo "Backend API health check failed with status $API_STATUS"
            exit 1
          fi
          echo "All services verified healthy!"
