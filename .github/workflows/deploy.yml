name: Deploy to AWS EC2

on:
  push:
    tags:
      - 'deploy_*'

jobs:
  deploy:
    name: Deploy to EC2 (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Deploy Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          cat << 'SSH_CONFIG' > ~/.ssh/config
          Host *
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
          SSH_CONFIG
          chmod 600 ~/.ssh/config

      - name: Verify SSH Connection
        run: |
          ssh -o BatchMode=yes ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'SSH connection successful! Host uptime:' && uptime"

      - name: Deploy Code via Rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new" \
            --exclude='.git*' \
            --exclude='RESTORE*' \
            --exclude='*restore*' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='.env*' \
            --exclude='data/*.db*' \
            --exclude='data/uploads/' \
            --exclude='.cache/' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_TARGET_DIR }}/

      - name: Set Permissions and Reload Services
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'REMOTE_SCRIPT'
            set -euo pipefail
            sudo chown -R ubuntu:ubuntu ${{ secrets.EC2_TARGET_DIR }}
            sudo systemctl daemon-reload
            sudo systemctl restart youan-radar-api.service
            sudo systemctl reload nginx
            echo "Nginx and youan-radar-api service restarted successfully."
          REMOTE_SCRIPT

      - name: Health Check through EC2 Nginx
        run: |
          # Use the established SSH route; EC2_HOST may be an SSH-only address.
          # Validate actual HTML and JSON, not just a running systemd process.
          ssh -o BatchMode=yes -o ConnectTimeout=15 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'python3 - --base-url http://127.0.0.1' < scripts/deployment_health.py

      - name: Check public HTTP reachability
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Public reachability is a separate signal from application readiness.
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 3 --output /dev/null "http://${EC2_HOST}/preview.html"; then
            echo "Public frontend reachable from GitHub runner."
          else
            echo "::warning::EC2 application checks passed via SSH, but the runner cannot reach public HTTP. Check the public hostname and ingress rules; no network policy was changed."
          fi
