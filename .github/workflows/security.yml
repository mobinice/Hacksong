name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q server.py scripts
      - name: Run API tests
        run: python -m unittest discover -s tests -v
      - name: Scan for secrets and unsafe transport settings
        run: python scripts/security_scan.py
