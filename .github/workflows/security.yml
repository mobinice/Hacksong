name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: youan_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:test-only@localhost:5432/youan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test driver
        run: python -m pip install psycopg2-binary==2.9.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test browser API routing and state serialization
        run: node --test tests/official-config.test.cjs
      - name: Compile Python
        run: python -m compileall -q server.py scripts
      - name: Run API tests
        run: python -m unittest discover -s tests -v
      - name: Scan for secrets and unsafe transport settings
        run: python scripts/security_scan.py
