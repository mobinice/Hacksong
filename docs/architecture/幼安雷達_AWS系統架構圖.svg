<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#eef4f8"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d766e"/><stop offset="1" stop-color="#125b73"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324d" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7e9bb2"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;fill:#17324d}
      .title{font-size:39px;font-weight:700;letter-spacing:1px}.subtitle{font-size:18px;fill:#688098}
      .lane{font-size:15px;font-weight:700;letter-spacing:2px;fill:#607b93}.card{fill:#fff;stroke:#d8e3ec;stroke-width:1.5;filter:url(#shadow)}
      .h{font-size:20px;font-weight:700}.p{font-size:14px;fill:#667d92}.service{font-size:15px;font-weight:700;fill:#fff}.serviceSub{font-size:12px;fill:#dff4f1}
      .tag{font-size:11px;font-weight:700;letter-spacing:1px;fill:#fff}.note{font-size:13px;fill:#607a90}.arrow{fill:none;stroke:#7e9bb2;stroke-width:3;marker-end:url(#arrow)}
      .flow{font-size:12px;font-weight:700;fill:#54718b}.small{font-size:12px;fill:#6d8397}.strong{font-size:13px;font-weight:700}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1750" cy="-30" r="250" fill="#e5f2f3"/><circle cx="80" cy="1020" r="220" fill="#e9eef8"/>

  <text x="96" y="75" class="title">幼安雷達｜AWS 系統架構</text>
  <text x="96" y="111" class="subtitle">分散資料整合 → 固定格式文件結構化 → 可解釋風險排序 → 人工查核與追蹤</text>
  <rect x="1598" y="45" width="226" height="48" rx="24" fill="#17324d"/><text x="1711" y="76" text-anchor="middle" class="service">Hackathon MVP</text>

  <text x="95" y="174" class="lane">01｜資料來源</text>
  <text x="455" y="174" class="lane">02｜文件儲存與 AI 處理</text>
  <text x="890" y="174" class="lane">03｜EC2 應用與關聯式資料</text>
  <text x="1450" y="174" class="lane">04｜承辦人工作介面</text>

  <!-- source cards -->
  <g>
    <rect class="card" x="90" y="205" width="270" height="112" rx="16"/><rect x="90" y="205" width="8" height="112" rx="4" fill="#2b6de8"/>
    <circle cx="132" cy="247" r="22" fill="#eaf1ff"/><path d="M120 248h24M132 236v24M121 239l22 18M143 239l-22 18" stroke="#2b6de8" stroke-width="2"/>
    <text x="167" y="244" class="h">公開網站／開放資料</text><text x="167" y="270" class="p">園所基本資料、招生人數</text><text x="167" y="291" class="p">CSV／Excel／JSON</text>

    <rect class="card" x="90" y="343" width="270" height="112" rx="16"/><rect x="90" y="343" width="8" height="112" rx="4" fill="#7d3ce7"/>
    <rect x="111" y="365" width="42" height="50" rx="5" fill="#f0eafe" stroke="#7d3ce7"/><path d="M121 378h22M121 387h22M121 396h16" stroke="#7d3ce7" stroke-width="2"/>
    <text x="167" y="382" class="h">財務／評鑑 PDF</text><text x="167" y="408" class="p">會計師報告、評鑑檢核表</text><text x="167" y="429" class="p">固定格式文件</text>

    <rect class="card" x="90" y="481" width="270" height="112" rx="16"/><rect x="90" y="481" width="8" height="112" rx="4" fill="#dc5a43"/>
    <circle cx="132" cy="523" r="22" fill="#fff0ed"/><path d="M122 523h20M132 513v20" stroke="#dc5a43" stroke-width="3"/>
    <text x="167" y="520" class="h">裁罰／收費資料</text><text x="167" y="546" class="p">裁罰紀錄、收費公告</text><text x="167" y="567" class="p">歷史年度與來源定位</text>

    <rect class="card" x="90" y="619" width="270" height="112" rx="16"/><rect x="90" y="619" width="8" height="112" rx="4" fill="#168976"/>
    <circle cx="132" cy="661" r="22" fill="#e4f6f1"/><path d="M121 663l8 8 16-20" fill="none" stroke="#168976" stroke-width="3"/>
    <text x="167" y="658" class="h">承辦人手動匯入</text><text x="167" y="684" class="p">補件、修正與來源確認</text><text x="167" y="705" class="p">人工確認後才寫入</text>
  </g>

  <!-- managed document services -->
  <g>
    <rect x="455" y="220" width="340" height="104" rx="18" fill="#173f66" filter="url(#shadow)"/>
    <rect x="476" y="242" width="88" height="27" rx="13" fill="#ff9900"/><text x="520" y="260" text-anchor="middle" class="tag">AWS S3</text>
    <text x="584" y="258" class="service">Private 原始文件區</text><text x="476" y="294" class="serviceSub">PDF／Excel／CSV · 保留原始檔、來源與版本</text>

    <rect class="card" x="455" y="372" width="340" height="112" rx="18"/><rect x="476" y="394" width="96" height="27" rx="13" fill="#5c39b7"/><text x="524" y="412" text-anchor="middle" class="tag">TEXTRACT</text>
    <text x="594" y="411" class="h">文件 OCR／表格擷取</text><text x="476" y="449" class="p">固定格式財務與評鑑 PDF 轉為文字及欄位</text>

    <rect class="card" x="455" y="532" width="340" height="112" rx="18"/><rect x="476" y="554" width="96" height="27" rx="13" fill="#5c39b7"/><text x="524" y="572" text-anchor="middle" class="tag">BEDROCK</text>
    <text x="594" y="571" class="h">欄位理解與輔助建議</text><text x="476" y="609" class="p">欄位對應、內容摘要與查核方向；不直接定罪</text>

    <rect class="card" x="455" y="692" width="340" height="52" rx="14"/><text x="625" y="724" text-anchor="middle" class="strong">批次匯入／人工確認後送入應用層</text>
  </g>

  <!-- EC2 application and relational store -->
  <g>
    <rect x="875" y="205" width="475" height="539" rx="25" fill="#e7f0f6" stroke="#afc7da" stroke-width="2"/>
    <rect x="875" y="205" width="475" height="66" rx="25" fill="#24395b"/><path d="M875 245h475v26H875z" fill="#24395b"/>
    <rect x="900" y="225" width="84" height="27" rx="13" fill="#ff9900"/><text x="942" y="243" text-anchor="middle" class="tag">AWS EC2</text>
    <text x="1004" y="244" class="service" style="font-size:20px">單一應用主機｜Hackathon MVP</text>

    <rect class="card" x="900" y="298" width="425" height="83" rx="16"/>
    <rect x="922" y="319" width="78" height="27" rx="13" fill="#168976"/><text x="961" y="337" text-anchor="middle" class="tag">NGINX</text>
    <text x="1020" y="337" class="h">靜態網站＋HTTPS／API 反向代理</text><text x="922" y="365" class="p">同一入口提供前端與 /api 路由</text>

    <rect x="900" y="405" width="425" height="105" rx="16" fill="url(#brand)" filter="url(#shadow)"/>
    <rect x="922" y="428" width="100" height="27" rx="13" fill="#ff9900"/><text x="972" y="446" text-anchor="middle" class="tag">PYTHON API</text>
    <text x="1042" y="445" class="service" style="font-size:19px">資料與案件服務</text>
    <text x="922" y="481" class="serviceSub">匯入驗證 · 園所歸戶 · 評鑑／覆核／案件 API</text>

    <rect x="900" y="534" width="425" height="98" rx="16" fill="#173f66" filter="url(#shadow)"/>
    <text x="922" y="565" class="service" style="font-size:19px">Normalize＋可解釋風險引擎</text>
    <text x="922" y="592" class="serviceSub">跨來源比對 · 歷史趨勢 · 構面權重 · Evidence</text>
    <text x="922" y="616" class="serviceSub">輸出分數、公式、原始依據與查核建議</text>

    <rect class="card" x="900" y="656" width="425" height="68" rx="16"/>
    <rect x="922" y="676" width="78" height="27" rx="13" fill="#2368a0"/><text x="961" y="694" text-anchor="middle" class="tag">SQLITE</text>
    <text x="1020" y="694" class="h">關聯資料庫｜加密 EBS</text>
    <text x="1020" y="716" class="p">園所 · 年度資料 · 文件 · 規則 · 結果 · 案件</text>
  </g>

  <!-- user experience -->
  <g>
    <rect class="card" x="1435" y="220" width="390" height="112" rx="20"/>
    <circle cx="1488" cy="264" r="24" fill="#eaf1ff"/><circle cx="1488" cy="256" r="8" fill="none" stroke="#2b6de8" stroke-width="2"/><path d="M1474 282q14-18 28 0" fill="none" stroke="#2b6de8" stroke-width="2"/>
    <text x="1528" y="260" class="h">教育局承辦人</text><text x="1528" y="286" class="p">瀏覽器透過 HTTPS 使用平台</text><text x="1528" y="307" class="p">AI 只提供排序與查核輔助</text>

    <rect x="1435" y="380" width="390" height="364" rx="24" fill="#fff" stroke="#cfdde8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="1435" y="380" width="390" height="72" rx="24" fill="#24395b"/><path d="M1435 428h390v24h-390z" fill="#24395b"/>
    <rect x="1460" y="403" width="84" height="27" rx="13" fill="#168976"/><text x="1502" y="421" text-anchor="middle" class="tag">WEB APP</text>
    <text x="1564" y="422" class="service" style="font-size:20px">幼安雷達</text>
    <g transform="translate(1465 478)">
      <rect x="0" y="0" width="160" height="92" rx="12" fill="#eef4ff"/><text x="18" y="34" class="h">資料工作台</text><text x="18" y="63" class="p">整合／來源／Excel</text>
      <rect x="184" y="0" width="160" height="92" rx="12" fill="#edf8f5"/><text x="202" y="34" class="h">風險總覽</text><text x="202" y="63" class="p">地圖／排序／篩選</text>
      <rect x="0" y="116" width="160" height="92" rx="12" fill="#fff5ed"/><text x="18" y="150" class="h">風險詳情</text><text x="18" y="179" class="p">權重／公式／證據</text>
      <rect x="184" y="116" width="160" height="92" rx="12" fill="#f5f0ff"/><text x="202" y="150" class="h">查核管理</text><text x="202" y="179" class="p">覆核／追蹤／交辦</text>
    </g>
  </g>

  <!-- arrows -->
  <path class="arrow" d="M360 261H455"/>
  <path class="arrow" d="M360 399H424Q442 399 442 371V284Q442 272 455 272"/>
  <path class="arrow" d="M360 537H424Q442 537 442 470V300Q442 288 455 288"/>
  <path class="arrow" d="M360 675H420Q442 675 442 312Q442 300 455 300"/>
  <path class="arrow" d="M625 324V372"/><text x="642" y="353" class="flow">PDF</text>
  <path class="arrow" d="M625 484V532"/><text x="642" y="514" class="flow">OCR 結果</text>
  <path class="arrow" d="M795 588H835Q854 588 854 567V458Q854 447 900 447"/><text x="804" y="574" class="flow">結構化建議</text>
  <path class="arrow" d="M795 718H850Q868 718 868 480Q868 469 900 469"/>
  <path class="arrow" d="M1112 381V405"/>
  <path class="arrow" d="M1112 510V534"/>
  <path class="arrow" d="M1112 632V656"/><text x="1129" y="649" class="flow">交易寫入</text>
  <path class="arrow" d="M1350 339H1395Q1415 339 1415 276H1435"/><text x="1361" y="323" class="flow">HTTPS</text>
  <path class="arrow" d="M1435 416H1388Q1368 416 1368 339H1350"/><text x="1376" y="401" class="flow">頁面／API</text>

  <!-- foundation -->
  <rect x="90" y="805" width="1735" height="157" rx="22" fill="#e9f0f6" stroke="#d2dfe9"/>
  <text x="121" y="842" class="lane">安全、持久化與維運基礎</text>
  <g transform="translate(121 866)">
    <rect x="0" y="0" width="292" height="67" rx="13" fill="#fff"/><circle cx="30" cy="34" r="16" fill="#fff0d7"/><text x="30" y="39" text-anchor="middle" class="strong">S</text><text x="57" y="29" class="strong">S3 Private＋KMS</text><text x="57" y="50" class="small">原始文件不公開、靜態加密</text>
    <rect x="316" y="0" width="292" height="67" rx="13" fill="#fff"/><circle cx="346" cy="34" r="16" fill="#eaf1ff"/><text x="346" y="39" text-anchor="middle" class="strong">D</text><text x="373" y="29" class="strong">EBS＋SQLite 備份</text><text x="373" y="50" class="small">持久磁碟、快照與 S3 備份</text>
    <rect x="632" y="0" width="292" height="67" rx="13" fill="#fff"/><circle cx="662" cy="34" r="16" fill="#e9edff"/><text x="662" y="39" text-anchor="middle" class="strong">I</text><text x="689" y="29" class="strong">IAM EC2 Role</text><text x="689" y="50" class="small">僅允許必要的 AWS 服務</text>
    <rect x="948" y="0" width="292" height="67" rx="13" fill="#fff"/><circle cx="978" cy="34" r="16" fill="#e5f7ed"/><text x="978" y="39" text-anchor="middle" class="strong">C</text><text x="1005" y="29" class="strong">CloudWatch</text><text x="1005" y="50" class="small">API 日誌、錯誤與資源監控</text>
    <rect x="1264" y="0" width="321" height="67" rx="13" fill="#fff"/><circle cx="1294" cy="34" r="16" fill="#feecee"/><text x="1294" y="39" text-anchor="middle" class="strong">E</text><text x="1321" y="29" class="strong">Evidence First</text><text x="1321" y="50" class="small">原文可追溯、結果由人工確認</text>
  </g>

  <text x="96" y="1020" class="note">MVP：單台 EC2＋SQLite 降低開發複雜度；若未來需要多機、高併發寫入或高可用，再遷移至 PostgreSQL／RDS。</text>
  <text x="1824" y="1020" text-anchor="end" class="note">幼安雷達 · Bug 不過夜</text>
</svg>
